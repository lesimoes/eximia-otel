info:
  name: Create user
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/users
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "new@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
